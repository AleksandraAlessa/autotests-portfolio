[pytest]
testpaths = shared hub_home community_resources community_rules
pythonpath = .
addopts = -v --tb=short

markers =
    api: API-тесты
    ui: UI-тесты
    smoke: smoke-тесты
    negative: негативные сценарии
    boundary: граничные значения
    roles: проверка ролей
    statuses: проверка статусов
